<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Memoriacraft</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <style>
    .admin-table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 14px; }
    .admin-table th, .admin-table td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    .admin-table th { background-color: #db2777; color: white; }
    .badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; display: inline-block; }
    .badge-pending { background: #fef08a; color: #854d0e; }
    .badge-paid { background: #bbf7d0; color: #166534; }
    .badge-shipped { background: #bfdbfe; color: #1e40af; }
    .action-btn { background: #2563eb; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
    .action-btn:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="container" style="max-width: 1100px;">
    <header>
      <h1>Admin Dashboard</h1>
      <p>Kelola Pesanan & Resi Memoriacraft</p>
    </header>

    <div style="margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;">
      <h3>Daftar Pesanan Masuk</h3>
      <button onclick="loadAdminOrders()" class="action-btn" style="padding: 8px 15px;">Refresh Data</button>
    </div>

    <div style="overflow-x: auto;">
      <table class="admin-table">
        <thead>
          <tr>
            <th>ID Order</th>
            <th>Pelanggan</th>
            <th>Detail Order</th>
            <th>Total & Komisi</th>
            <th>Status Bayar</th>
            <th>Status Kirim / Resi</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="admin-order-list">
          <tr><td colspan="7" style="text-align: center;">Memuat data pesanan...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    async function loadAdminOrders() {
      const tbody = document.getElementById('admin-order-list');
      tbody.innerHTML = '<tr><td colspan="7" style="text-align: center;">Memuat data pesanan...</td></tr>';

      // Ambil data order gabung dengan data produk
      const { data: orders, error } = await _supabase
        .from('orders')
        .select('*, products(name)')
        .order('created_at', { ascending: false });

      if (error) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: red;">Gagal memuat data.</td></tr>';
        console.error(error);
        return;
      }

      if (!orders || orders.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align: center;">Belum ada pesanan masuk.</td></tr>';
        return;
      }

      tbody.innerHTML = orders.map(ord => {
        const prodName = ord.products ? ord.products.name : 'Produk Dihapus';
        const refText = ord.referral_code ? `Ref: <strong>${ord.referral_code}</strong>` : 'Tanpa Ref';
        
        return `
          <tr>
            <td><strong>${ord.id}</strong><br><small style="color:#666;">${new Date(ord.created_at).toLocaleDateString('id-ID')}</small></td>
            <td>
              <strong>${ord.customer_name}</strong><br>
              <a href="https://wa.me/${ord.customer_wa}" target="_blank" style="color:#2563eb;">${ord.customer_wa}</a><br>
              <small>${ord.shipping_address}</small>
            </td>
            <td>
              <strong>${prodName}</strong> (${ord.quantity} pcs)<br>
              <small><em>Custom: ${ord.custom_details || '-'}</em></small>
            </td>
            <td>
              Total: <strong>Rp ${Number(ord.total_price).toLocaleString('id-ID')}</strong><br>
              <small style="color:green;">Komisi: Rp ${Number(ord.sales_commission_amount || 0).toLocaleString('id-ID')} (${refText})</small>
            </td>
            <td>
              <span class="badge ${ord.payment_status === 'PAID' ? 'badge-paid' : 'badge-pending'}">${ord.payment_status}</span>
            </td>
            <td>
              <span class="badge ${ord.order_status === 'SHIPPED' ? 'badge-shipped' : 'badge-pending'}">${ord.order_status}</span><br>
              <small>Resi: ${ord.tracking_number || '-'}</small>
            </td>
            <td>
              ${ord.payment_status === 'PENDING' ? `<button class="action-btn" style="background:#16a34a; margin-bottom:5px;" onclick="updatePayment('${ord.id}', 'PAID')">Set Lunas</button><br>` : ''}
              <button class="action-btn" onclick="updateTracking('${ord.id}')">Input Resi</button>
            </td>
          </tr>
        `;
      }).join('');
    }

    // Fungsi Update Status Pembayaran
    async function updatePayment(orderId, status) {
      if (!confirm(`Tandai pesanan ${orderId} sebagai LUNAS?`)) return;

      const { error } = await _supabase
        .from('orders')
        .update({ payment_status: status })
        .eq('id', orderId);

      if (error) {
        alert('Gagal memperbarui status pembayaran.');
      } else {
        alert('Status pembayaran berhasil diperbarui!');
        loadAdminOrders();
      }
    }

    // Fungsi Input Nomor Resi Pengiriman
    async function updateTracking(orderId) {
      const resi = prompt('Masukkan Nomor Resi Pengiriman (J&T):');
      if (!resi) return;

      const { error } = await _supabase
        .from('orders')
        .update({ 
          tracking_number: resi,
          order_status: 'SHIPPED'
        })
        .eq('id', orderId);

      if (error) {
        alert('Gagal menyimpan nomor resi.');
      } else {
        alert('Nomor resi berhasil disimpan!');
        loadAdminOrders();
      }
    }

    // Jalankan saat halaman dibuka
    loadAdminOrders();
  </script>
</body>
</html>
